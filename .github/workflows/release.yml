name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify, publish, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify tag matches mod version
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ ! "${mod_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "mod_version must be a stable SemVer x.y.z value: ${mod_version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${mod_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${mod_version}." >&2
            exit 1
          fi
      - name: Verify and build
        run: ./gradlew --no-daemon clean check build
      - name: Publish Maven package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew --no-daemon publish
      - name: Create checksums
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          (
            cd build/libs
            sha256sum "allthemons-cobbleworkers-optimizer-${mod_version}.jar"
          ) > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          production_jar="build/libs/allthemons-cobbleworkers-optimizer-${mod_version}.jar"
          gh release create "${GITHUB_REF_NAME}" \
            "${production_jar}" \
            SHA256SUMS.txt \
            --generate-notes \
            --verify-tag \
            --title "All the Mons Cobbleworkers Optimizer ${GITHUB_REF_NAME}"
