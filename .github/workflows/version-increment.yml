name: Version policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  version-increment:
    name: Version increment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an increased mod version
        id: version
        shell: bash
        run: |
          base_version="$(git show "${{ github.event.pull_request.base.sha }}:gradle.properties" \
            | sed -n 's/^mod_version=//p')"
          head_version="$(sed -n 's/^mod_version=//p' gradle.properties)"

          python3 - "${base_version}" "${head_version}" <<'PY'
          import re
          import sys

          pattern = re.compile(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          )
          base, head = sys.argv[1:3]
          if pattern.fullmatch(base) is None or pattern.fullmatch(head) is None:
              raise SystemExit(
                  "Versions must be stable SemVer x.y.z values: "
                  f"base={base}, head={head}"
              )
          if tuple(map(int, head.split("."))) <= tuple(map(int, base.split("."))):
              raise SystemExit(
                  f"mod_version must increase: base={base}, head={head}"
              )
          print(f"mod_version increased from {base} to {head}")
          PY

      - name: Comment when the version was not increased
        if: failure() && steps.version.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- allthemons-cobbleworkers-optimizer-version-policy -->';
            const body = `${marker}
            This pull request cannot be merged because \`mod_version\` in
            \`gradle.properties\` has not been increased above the target
            branch. Increase it and push again.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
