name: Version policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  version-increment:
    name: Version increment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an increased mod version
        id: version
        shell: bash
        run: |
          base_version="$(git show "${{ github.event.pull_request.base.sha }}:gradle.properties" \
            | sed -n 's/^mod_version=//p')"
          head_version="$(sed -n 's/^mod_version=//p' gradle.properties)"

          if [[ -z "${base_version}" || -z "${head_version}" ]]; then
            echo "Unable to read mod_version from gradle.properties." >&2
            exit 1
          fi

          if [[ "${base_version}" == "${head_version}" ]]; then
            echo "mod_version must be increased from ${base_version}." >&2
            exit 1
          fi

          highest="$(printf '%s\n%s\n' "${base_version}" "${head_version}" \
            | sort -V | tail -n 1)"
          if [[ "${highest}" != "${head_version}" ]]; then
            echo "mod_version must increase; ${head_version} is not newer than ${base_version}." >&2
            exit 1
          fi

          echo "mod_version increased from ${base_version} to ${head_version}."

      - name: Comment when the version was not increased
        if: failure() && steps.version.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- allthemons-cobbleworkers-optimizer-version-policy -->';
            const body = `${marker}
            This pull request cannot be merged because \`mod_version\` in
            \`gradle.properties\` has not been increased above the target
            branch. Increase it and push again.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
