name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build
        run: ./gradlew --no-daemon clean check build
      - name: Stage production JAR
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          mkdir -p artifacts
          cp "build/libs/allthemons-cobbleworkers-optimizer-${version}.jar" artifacts/
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: build/reports/
          if-no-files-found: ignore
      - name: Upload production mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: allthemons-cobbleworkers-optimizer
          path: artifacts/*.jar
          if-no-files-found: error
