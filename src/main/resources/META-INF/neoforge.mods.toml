modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/jan-guenter/allthemons-cobbleworkers-optimizer/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Jan Guenter"
displayURL = "https://github.com/jan-guenter/allthemons-cobbleworkers-optimizer"
description = '''
Server-only high-level decision scheduling and diagnostics for the exact
Cobbleworkers stack shipped by All the Mons 1.1.1.
'''

[[mixins]]
config = "atmons_cobbleworkers_optimizer.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.234,21.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[1.7.3+1.21.1]"
ordering = "AFTER"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "cobbleworkers"
type = "required"
versionRange = "[1.8.0+1.7.0]"
ordering = "AFTER"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "allthemons"
type = "required"
versionRange = "[0.3.0]"
ordering = "AFTER"
side = "SERVER"
